<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOCKUP — Turntable now playing</title>
<!--
  Approved design reference for the main screen (iPad landscape, 1194×834 frame).
  Uses fake data and a drawn placeholder cover. In the real app the label shows the album cover image.
  Mockup-only: the theme switch in the top-right corner of the browser window.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="parchment"] {
    --bg:#ddd3c1; --plinth:#b99f7f; --plinth-hi:#c9b292; --arm-base:#b08d57;
    --text:#28221c; --muted:#5a4e41; --track:#c9bda9; --soft:#d0c5b2;
    --accent:#6e4b30; --on-accent:#f3ecdf; --shadow:rgba(70,55,35,0.28);
  }
  [data-theme="caramel"] {
    --bg:#7a5a40; --plinth:#9b7757; --plinth-hi:#ad8a69; --arm-base:#c9a55c;
    --text:#f6eee2; --muted:#efe2d0; --track:#8f6d51; --soft:#86644a;
    --accent:#f1e4cf; --on-accent:#5a3f2a; --shadow:rgba(50,30,15,0.35);
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#8a8580; font-family:Inter, sans-serif; }

  .screen { width:1194px; height:834px; border-radius:24px; overflow:hidden; background:var(--bg); color:var(--text);
            display:flex; align-items:center; gap:48px; padding:48px; }

  /* Turntable */
  .plinth { position:relative; width:640px; height:738px; flex:none; border-radius:28px; background:var(--plinth);
            box-shadow:inset 0 2px 0 var(--plinth-hi), 0 24px 50px var(--shadow); }
  .platter { position:absolute; left:32px; top:90px; width:520px; height:520px; padding:0; border:none; border-radius:50%;
             background:#1a1a1c; box-shadow:0 14px 34px rgba(30,30,40,0.35);
             display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .record { width:500px; height:500px; border-radius:50%; display:flex; align-items:center; justify-content:center;
            background:repeating-radial-gradient(circle, #141416 0 2px, #202024 2px 4px);
            animation:spin var(--spin, 5s) linear infinite; animation-play-state:paused; }
  .is-playing .record { animation-play-state:running; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .label { position:relative; width:220px; height:220px; border-radius:50%; overflow:hidden; background:#f2c38b;
           display:flex; align-items:center; justify-content:center; }
  /* Placeholder cover art — the real app uses <img src="album cover"> with object-fit: cover */
  .label .sun   { position:absolute; left:112px; top:46px; width:64px; height:64px; border-radius:50%; background:#e8714d; }
  .label .hill1 { position:absolute; left:-40px; top:112px; width:200px; height:140px; border-radius:50%; background:#3f6e9e; }
  .label .hill2 { position:absolute; left:90px; top:130px; width:200px; height:140px; border-radius:50%; background:#2a4f78; }
  .label .tag   { position:absolute; left:0; right:0; bottom:34px; text-align:center; font-size:10px; font-weight:600;
                  letter-spacing:.12em; color:#fff; }
  .spindle { position:relative; width:14px; height:14px; border-radius:50%; background:#e8e6e1; box-shadow:0 0 0 4px #141416; }

  .arm-base { position:absolute; left:548px; top:78px; width:64px; height:64px; border-radius:50%; background:var(--arm-base);
              box-shadow:inset 0 -4px 0 rgba(0,0,0,.15), 0 6px 14px rgba(30,30,40,.25); }
  .arm { position:absolute; left:573px; top:110px; width:14px; height:340px; transform-origin:7px 0;
         transform:rotate(4deg); transition:transform 700ms ease-in-out; pointer-events:none; }
  .is-playing .arm { transform:rotate(24deg); }
  .arm .rod  { width:8px; height:300px; margin-left:3px; border-radius:4px; background:#f7f5f1; box-shadow:0 2px 6px rgba(0,0,0,.2); }
  .arm .head { width:22px; height:40px; margin-left:-4px; border-radius:4px; background:#2a2a2e; }

  .spin-setting { position:absolute; left:28px; bottom:24px; display:flex; align-items:center; gap:2px; color:var(--muted); font-size:12px; }
  .spin-setting select { height:44px; padding:0 4px; border:none; background:transparent; color:var(--muted);
                         font:inherit; cursor:pointer; }

  /* Info column */
  .info { flex:1; min-width:0; display:flex; flex-direction:column; gap:28px; }
  .status { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; letter-spacing:.14em; color:var(--muted); }
  .status .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  h1 { margin:0; font-family:'Space Grotesk', sans-serif; font-size:44px; line-height:1.05; font-weight:700; }
  .sub { margin:10px 0 0; font-size:18px; color:var(--muted); }
  .bar { height:6px; border-radius:3px; background:var(--track); }
  .bar > div { width:43%; height:6px; border-radius:3px; background:var(--accent); }
  .times { display:flex; justify-content:space-between; margin-top:8px; font-size:13px; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:20px; }
  .controls button { border:none; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .btn-sm { width:56px; height:56px; background:var(--soft); color:var(--text); }
  .btn-play { width:80px; height:80px; background:var(--accent); color:var(--on-accent); box-shadow:0 10px 24px rgba(30,40,60,.2); }
  .icon-pause { display:none; }
  .is-playing .icon-pause { display:block; } .is-playing .icon-play { display:none; }

  .next { display:flex; align-items:center; gap:16px; padding:16px; border-radius:18px; background:var(--soft); }
  .next .cover { position:relative; width:60px; height:60px; flex:none; border-radius:10px; overflow:hidden; background:#c9dceb; }
  .next .cover i:first-child { position:absolute; left:10px; top:10px; width:24px; height:24px; border-radius:50%; background:#fff; }
  .next .cover i:last-child  { position:absolute; left:-10px; top:34px; width:80px; height:40px; border-radius:50%; background:#7fb3a8; }
  .next small { font-size:12px; font-weight:600; letter-spacing:.14em; color:var(--muted); }
  .next strong { display:block; font-size:17px; margin:4px 0 2px; }
  .next span { font-size:14px; color:var(--muted); }

  .mockup-theme { position:fixed; top:12px; right:12px; font-size:12px; color:#fff; }
  .mockup-theme select { margin-left:6px; }

  @media (prefers-reduced-motion: reduce) { .record { animation:none; } .arm { transition:none; } }
</style>
</head>
<body>
  <div class="mockup-theme">
    <label for="theme">Mockup theme</label>
    <select id="theme"><option value="parchment">Parchment</option><option value="caramel">Caramel</option></select>
  </div>

  <main class="screen is-playing" id="screen" data-theme="parchment">
    <section class="plinth" aria-label="Turntable">
      <button class="platter" id="platter" aria-label="Tap the record to pause">
        <div class="record" id="record">
          <div class="label">
            <span class="sun"></span><span class="hill1"></span><span class="hill2"></span>
            <span class="tag">ALBUM COVER</span>
            <span class="spindle"></span>
          </div>
        </div>
      </button>
      <div class="arm-base"></div>
      <div class="arm"><div class="rod"></div><div class="head"></div></div>
      <div class="spin-setting">
        <label for="spin">spin</label>
        <select id="spin" aria-label="Seconds per turn">
          <option value="1">1s</option><option value="3">3s</option>
          <option value="5" selected>5s</option><option value="7">7s</option><option value="10">10s</option>
        </select>
      </div>
    </section>

    <section class="info">
      <div class="status"><span class="dot"></span><span id="status">NOW PLAYING</span></div>
      <div>
        <h1>[Song title]</h1>
        <p class="sub">[Artist] · [Album]</p>
      </div>
      <div>
        <div class="bar"><div></div></div>
        <div class="times"><span>1:42</span><span>3:58</span></div>
      </div>
      <div class="controls">
        <button class="btn-sm" aria-label="Previous track">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20L9 12l10-8v16z"/><path d="M5 19V5"/></svg>
        </button>
        <button class="btn-play" id="play" aria-label="Pause">
          <svg class="icon-pause" aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M8 5v14"/><path d="M16 5v14"/></svg>
          <svg class="icon-play" aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg>
        </button>
        <button class="btn-sm" aria-label="Next track">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg>
        </button>
      </div>
      <div class="next">
        <div class="cover" aria-hidden="true"><i></i><i></i></div>
        <div><small>UP NEXT</small><strong>[Next song]</strong><span>[Artist]</span></div>
      </div>
    </section>
  </main>

<script>
  const screen = document.getElementById('screen');
  const record = document.getElementById('record');
  const playBtn = document.getElementById('play');
  const platter = document.getElementById('platter');
  const status = document.getElementById('status');

  function toggle() {
    const playing = screen.classList.toggle('is-playing');
    status.textContent = playing ? 'NOW PLAYING' : 'PAUSED';
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    platter.setAttribute('aria-label', playing ? 'Tap the record to pause' : 'Tap the record to play');
  }
  playBtn.addEventListener('click', toggle);
  platter.addEventListener('click', toggle);

  document.getElementById('spin').addEventListener('change', (e) => {
    record.style.setProperty('--spin', e.target.value + 's');
  });
  document.getElementById('theme').addEventListener('change', (e) => {
    screen.dataset.theme = e.target.value;
  });
</script>
</body>
</html>
